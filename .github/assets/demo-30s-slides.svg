<svg xmlns="http://www.w3.org/2000/svg" width="960" height="2700" viewBox="0 0 960 2700" role="img" aria-labelledby="title description">
  <title id="title">Copilot Proxy API 30-second demo slides</title>
  <desc id="description">A five-scene terminal walkthrough showing setup, Claude Code, and Codex CLI using Copilot Proxy API.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2021" />
      <stop offset="1" stop-color="#282828" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#665c54" stroke-width="1" opacity="0.14" />
    </pattern>
    <g id="scene-background">
      <rect width="960" height="540" fill="url(#background)" />
      <rect width="960" height="540" fill="url(#grid)" />
      <rect x="28" y="24" width="904" height="492" rx="24" fill="none" stroke="#504945" stroke-width="2" />
      <g transform="translate(54 44)">
        <rect width="32" height="32" rx="9" fill="#8ec07c" />
        <path d="M8 10h6l4 6h6M8 22h6l4-6" fill="none" stroke="#1d2021" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="24" cy="16" r="3" fill="#1d2021" />
        <text x="46" y="22" fill="#ebdbb2" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">COPILOT-PROXY-API</text>
      </g>
      <text x="54" y="492" fill="#a89984" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">UNOFFICIAL · OPEN SOURCE · USE RESPONSIBLY</text>
    </g>
    <g id="terminal-window">
      <rect width="852" height="246" rx="18" fill="#1d2021" stroke="#665c54" stroke-width="2" />
      <rect x="1" y="1" width="850" height="44" rx="17" fill="#32302f" />
      <path d="M1 44h850" stroke="#504945" />
      <circle cx="23" cy="22" r="5" fill="#fb4934" />
      <circle cx="42" cy="22" r="5" fill="#fabd2f" />
      <circle cx="61" cy="22" r="5" fill="#b8bb26" />
      <text x="426" y="28" text-anchor="middle" fill="#928374" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">localhost:4141</text>
    </g>
  </defs>

  <!-- Scene 1: intro -->
  <g transform="translate(0 0)">
    <use href="#scene-background" />
    <text x="54" y="176" fill="#fbf1c7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="51" font-weight="800" letter-spacing="-1.5">Claude Code + Codex CLI.</text>
    <text x="54" y="244" fill="#8ec07c" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="51" font-weight="800" letter-spacing="-1.5">One self-hosted proxy.</text>
    <text x="56" y="307" fill="#d5c4a1" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">A 30-second animated walkthrough</text>
    <g transform="translate(56 354)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">
      <rect width="156" height="38" rx="19" fill="#32302f" stroke="#458588" />
      <circle cx="21" cy="19" r="5" fill="#83a598" />
      <text x="36" y="24" fill="#d5c4a1">Responses API</text>
      <g transform="translate(172 0)">
        <rect width="160" height="38" rx="19" fill="#32302f" stroke="#689d6a" />
        <circle cx="21" cy="19" r="5" fill="#8ec07c" />
        <text x="36" y="24" fill="#d5c4a1">Messages API</text>
      </g>
    </g>
  </g>

  <!-- Scene 2: setup -->
  <g transform="translate(0 540)">
    <use href="#scene-background" />
    <text x="54" y="124" fill="#fbf1c7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="33" font-weight="800">Start Claude Code in one command</text>
    <g transform="translate(54 158)">
      <use href="#terminal-window" />
      <g transform="translate(28 80)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
        <text fill="#8ec07c" font-weight="700">$ npx copilot-proxy-api@latest start --claude-code</text>
        <text y="45" fill="#b8bb26">✓ <tspan fill="#d5c4a1">Logged in with GitHub</tspan></text>
        <text y="82" fill="#b8bb26">✓ <tspan fill="#d5c4a1">Copilot models loaded</tspan></text>
        <text y="119" fill="#b8bb26">✓ <tspan fill="#d5c4a1">Claude Code launch command copied</tspan></text>
      </g>
    </g>
  </g>

  <!-- Scene 3: Claude Code -->
  <g transform="translate(0 1080)">
    <use href="#scene-background" />
    <text x="54" y="124" fill="#fbf1c7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="33" font-weight="800">Claude Code via Anthropic Messages</text>
    <g transform="translate(54 158)">
      <use href="#terminal-window" />
      <g transform="translate(28 86)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
        <text fill="#8ec07c" font-weight="700">$ claude -p "Say exactly: Proxy demo ready."</text>
        <text y="64" fill="#928374">Claude Code</text>
        <text y="104" fill="#b8bb26" font-weight="700">Proxy demo ready.</text>
      </g>
    </g>
    <text x="56" y="438" fill="#a89984" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">STREAMING · TOOL CALLS · CONTEXT MANAGEMENT</text>
  </g>

  <!-- Scene 4: Codex CLI -->
  <g transform="translate(0 1620)">
    <use href="#scene-background" />
    <text x="54" y="124" fill="#fbf1c7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="33" font-weight="800">Codex CLI via OpenAI Responses</text>
    <g transform="translate(54 158)">
      <use href="#terminal-window" />
      <g transform="translate(28 80)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
        <text fill="#8ec07c" font-weight="700">$ codex exec "Say exactly: Codex proxy ready."</text>
        <text y="48" fill="#928374">provider: <tspan fill="#83a598">copilot_proxy</tspan></text>
        <text y="90" fill="#928374">Codex CLI</text>
        <text y="130" fill="#b8bb26" font-weight="700">Codex proxy ready.</text>
      </g>
    </g>
    <text x="56" y="438" fill="#a89984" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">RESPONSES API · MODEL ROUTING · REQUEST TRACING</text>
  </g>

  <!-- Scene 5: close -->
  <g transform="translate(0 2160)">
    <use href="#scene-background" />
    <text x="480" y="186" text-anchor="middle" fill="#fbf1c7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="800">Use Copilot with</text>
    <text x="480" y="250" text-anchor="middle" fill="#8ec07c" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="800">your coding agents.</text>
    <rect x="214" y="304" width="532" height="54" rx="13" fill="#1d2021" stroke="#665c54" />
    <text x="480" y="339" text-anchor="middle" fill="#ebdbb2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">github.com/voidsteed/copilot-proxy-api</text>
  </g>
</svg>
